const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for(let i=0; i<3000; i++) {
  starVerts.push((Math.random()-0.5)*1200, Math.random()*200+20, (Math.random()-0.5)*1200);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size:0.3, color:0x668899 })));

const texLoader = new THREE.TextureLoader();

const shipMeshes = [];
const stats = { loaded: 0, fallback: 0, failed: 0, failedKeys: [], substituted: [] };
window.GALLERY_STATS = stats;

function slotPos(i) {
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  return {
    x: (col - (COLS - 1) / 2) * GAP_X,
    z: (row - (rows - 1) / 2) * GAP_Z,
  };
}

function encodeAsset(path) {
  if (!path) return path;
  return encodeURI(path);
}

function cdnPath(path) {
  const rel = path.replace(/^\/assets\//, '');
  return `${CDN}/${encodeURI(rel)}`;
}

function candidateUrls(path, pack) {
  if (pack === 'carrier') {
    const rel = path.replace(/^\/assets\/carrier\/models\//, '').replace(/^\//, '');
    return [
      '/assets/carrier/models/' + encodeURI(rel),
      CARRIER_CDN + '/' + encodeURI(rel),
    ];
  }
  const local = encodeAsset(path);
  const cdn = cdnPath(path);
  return local === cdn ? [local] : [local, cdn];
}

function dirOf(path) {
  const i = path.lastIndexOf('/');
  return i >= 0 ? path.slice(0, i + 1) : '/';
}

function meshExtent(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  box.getSize(size);
  return Math.max(size.x, size.y, size.z);
}

// Parity with Carrier modelFit.autoOrientShip + Armada space-rig.ts
function autoOrientShip(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  const alongX = size.x >= size.z;
  const half = (alongX ? size.x : size.z) * 0.5 || 1;
  const cut = 0.45 * half;
  const cLng = alongX ? center.x : center.z;
  const cPer = alongX ? center.z : center.x;
  let total = 0;
  obj.traverse(o => { if (o.isMesh) total += o.geometry?.getAttribute('position')?.count || 0; });
  const step = total > 4000 ? Math.ceil(total / 4000) : 1;
  let frontR = 0, frontN = 0, backR = 0, backN = 0, i = 0;
  const v = new THREE.Vector3();
  obj.traverse(o => {
    if (!o.isMesh) return;
    const pos = o.geometry?.getAttribute('position');
    if (!pos) return;
    for (let k = 0; k < pos.count; k++, i++) {
      if (i % step !== 0) continue;
      v.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld);
      const lng = (alongX ? v.x : v.z) - cLng;
      const r = Math.abs((alongX ? v.z : v.x) - cPer);
      if (lng > cut) { frontR += r; frontN++; }
      else if (lng < -cut) { backR += r; backN++; }
    }
  });
  const fAvg = frontN ? frontR / frontN : Infinity;
  const bAvg = backN ? backR / backN : Infinity;
  const noseSign = fAvg <= bAvg ? 1 : -1;
  const nx = alongX ? noseSign : 0;
  const nz = alongX ? 0 : noseSign;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.atan2(nx, nz));
  obj.quaternion.premultiply(q);
  obj.userData.shipAxes = { nose: 'z+', side: 'x+', up: 'y+', boosters: 'z-' };
}

function findBoosterAnchors(root) {
  root.updateMatrixWorld(true);
  const named = [];
  const w = new THREE.Vector3();
  const nameRe = /engine|thruster|exhaust|booster|nozzle|jet|propuls/i;
  root.traverse(o => {
    if (!nameRe.test(o.name)) return;
    o.getWorldPosition(w);
    named.push(root.worldToLocal(w.clone()));
  });
  if (named.length) return named.slice(0, 6);
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3();
  box.getSize(size);
  const zCut = box.min.z + Math.max(size.z * 0.12, 0.02);
  const tail = [];
  const v = new THREE.Vector3();
  let total = 0;
  root.traverse(o => { if (o.isMesh) total += o.geometry?.getAttribute('position')?.count || 0; });
  const step = total > 3000 ? Math.ceil(total / 3000) : 1;
  let i = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    const pos = o.geometry?.getAttribute('position');
    if (!pos) return;
    for (let k = 0; k < pos.count; k++, i++) {
      if (i % step !== 0) continue;
      v.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld);
      if (v.z > zCut) continue;
      tail.push(root.worldToLocal(v.clone()));
    }
  });
  if (!tail.length) {
    const c = box.getCenter(new THREE.Vector3());
    return [root.worldToLocal(new THREE.Vector3(c.x, c.y, box.min.z))];
  }
  let minX = Infinity, maxX = -Infinity, sx = 0, sy = 0, sz = 0;
  for (const p of tail) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    sx += p.x; sy += p.y; sz += p.z;
  }
  const n = tail.length;
  if (maxX - minX < Math.max(size.x * 0.25, 0.08)) return [new THREE.Vector3(sx / n, sy / n, sz / n)];
  const mid = (minX + maxX) * 0.5;
  const left = tail.filter(p => p.x < mid);
  const right = tail.filter(p => p.x >= mid);
  const avg = arr => {
    const a = new THREE.Vector3();
    for (const p of arr) a.add(p);
    return a.multiplyScalar(1 / arr.length);
  };
  const out = [];
  if (left.length) out.push(avg(left));
  if (right.length) out.push(avg(right));
  return out.length ? out : [new THREE.Vector3(sx / n, sy / n, sz / n)];
}

function mountHullJets(obj, size) {
  const sockets = findBoosterAnchors(obj);
  const jetLen = Math.max(0.35, size * 0.16);
  for (const p of sockets) {
    const jet = new THREE.Mesh(
      new THREE.ConeGeometry(jetLen * 0.22, jetLen, 8),
      new THREE.MeshBasicMaterial({ color: 0x66eeff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    jet.rotation.x = -Math.PI / 2;
    jet.position.copy(p);
    jet.position.z -= jetLen * 0.45;
    jet.name = 'hullJet';
    obj.add(jet);
  }
}

function applyLook(obj, ship) {
  const texUrl = ship.tex;
  if (texUrl) {
    const urls = candidateUrls(texUrl, ship.pack);
    const texture = texLoader.load(urls[0]);
    texture.colorSpace = THREE.SRGBColorSpace;
    obj.traverse(c => {
      if (c.isMesh) {
        c.material = new THREE.MeshStandardMaterial({ map: texture, metalness:0.4, roughness:0.6 });
      }
    });
  } else {
    obj.traverse(c => {
      if (c.isMesh && c.material) {
        const mats = Array.isArray(c.material) ? c.material : [c.material];
        mats.forEach(m => { m.metalness = 0.3; m.roughness = 0.6; });
      }
    });
  }
}

function placeShip(obj, ship, x, z) {
  const grounded = ship.cls === 'mothership' || ship.cls === 'station' || ship.cls === 'turret';
  if (ship.yaw != null) obj.rotation.y = ship.yaw;
  else if (!grounded) autoOrientShip(obj);
  const maxDim = meshExtent(obj) || 1;
  const targetSize = 2 + Math.log2(Math.max(ship.hp, 10)) * 1.5;
  obj.scale.setScalar(targetSize / maxDim);
  const box2 = new THREE.Box3().setFromObject(obj);
  const center = new THREE.Vector3();
  box2.getCenter(center);
  obj.position.set(x - center.x, -center.y + 2, z - center.z);
  applyLook(obj, ship);
  const axes = new THREE.AxesHelper(targetSize * 0.45);
  axes.name = 'shipAxes';
  obj.add(axes);
  if (ship.cls !== 'turret' && ship.cls !== 'station') mountHullJets(obj, targetSize);
  scene.add(obj);
  shipMeshes.push({ mesh: obj, worldPos: new THREE.Vector3(x, 4, z), ship });
}

function loadOnce(spec) {
  return new Promise((resolve, reject) => {
    const urls = candidateUrls(spec.model, spec.pack);
    const tryUrl = (idx) => {
      if (idx >= urls.length) { reject(new Error('all urls failed')); return; }
      const url = urls[idx];
      const fail = () => tryUrl(idx + 1);
      const ok = (obj) => {
        if (!obj || meshExtent(obj) < 0.001) { fail(); return; }
        resolve(obj);
      };
      try {
        if (spec.fmt === 'fbx') {
          new FBXLoader().load(url, ok, undefined, fail);
        } else if (spec.fmt === 'glb' || spec.fmt === 'gltf') {
          new GLTFLoader().load(url, (gltf) => ok(gltf.scene), undefined, fail);
        } else if (spec.fmt === 'obj' && spec.mtl) {
          const mtlUrls = candidateUrls(spec.mtl, spec.pack);
          const tryMtl = (mi) => {
            if (mi >= mtlUrls.length) {
              new OBJLoader().load(url, ok, undefined, fail);
              return;
            }
            const mtl = new MTLLoader();
            mtl.setResourcePath(encodeAsset(dirOf(spec.mtl)));
            mtl.load(mtlUrls[mi], (materials) => {
              materials.preload();
              const loader = new OBJLoader();
              loader.setMaterials(materials);
              loader.load(url, ok, undefined, () => tryMtl(mi + 1));
            }, undefined, () => tryMtl(mi + 1));
          };
          tryMtl(0);
        } else {
          new OBJLoader().load(url, ok, undefined, fail);
        }
      } catch (e) { fail(); }
    };
    tryUrl(0);
  });
}

async function loadSpec(spec) {
  if (spec.parts && spec.parts.length > 1) {
    const g = new THREE.Group();
    for (const p of spec.parts) {
      try {
        const child = await loadOnce(p);
        if (p.tex) applyLook(child, p);
        g.add(child);
      } catch (e) {
        console.warn('Part failed', p.model, e);
      }
    }
    if (!g.children.length) throw new Error('empty assembly');
    return g;
  }
  return loadOnce(spec);
}

async function loadShip(ship, x, z) {
  const tried = new Set([ship.model]);
  const queue = [ship];
  for (const fb of (CLASS_FALLBACK[ship.cls] || [])) {
    if (!tried.has(fb.model)) {
      tried.add(fb.model);
      queue.push(fb);
    }
  }
  if (!tried.has(LAST_RESORT.model)) queue.push(LAST_RESORT);
  for (let i = 0; i < queue.length; i++) {
    try {
      const obj = await loadSpec(queue[i]);
      const used = { ...ship, tex: queue[i].tex || ship.tex };
      placeShip(obj, used, x, z);
      if (i > 0) {
        stats.fallback++;
        stats.substituted.push(`${ship.key} → ${queue[i].model}`);
        console.warn(`Substituted ${ship.name} → ${queue[i].model}`);
      }
      stats.loaded++;
      return;
    } catch (err) {
      console.warn(`Failed ${ship.name} hull ${queue[i].model}`, err);
    }
  }
  const geo = new THREE.BoxGeometry(2,2,2);
  const mat = new THREE.MeshStandardMaterial({ color: 0xff4444, wireframe:true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 2, z);
  scene.add(mesh);
  shipMeshes.push({ mesh, worldPos: new THREE.Vector3(x, 4, z), ship });
  stats.failed++;
  stats.failedKeys.push(ship.key);
  stats.loaded++;
}

function frameCamera() {
  const depth = Math.max((rows - 1) * GAP_Z, GAP_Z);
  const width = Math.max((COLS - 1) * GAP_X, GAP_X);
  const span = Math.max(width, depth);
  camera.position.set(0, span * 1.28 + 18, span * 0.16);
  controls.target.set(0, 1, 0);
}

function updateCount() {
  const extra = [];
  if (stats.fallback) extra.push(`${stats.fallback} substituted`);
  if (stats.failed) extra.push(`${stats.failed} missing`);
  const suffix = extra.length ? ` · ${extra.join(' · ')}` : '';
  document.getElementById('count').textContent =
    `${stats.loaded}/${SHIPS.length} · 8 / row${suffix}`;
}

async function loadAll() {
  frameCamera();
  const CONCURRENCY = 4;
  let next = 0;
  async function worker() {
    while (next < SHIPS.length) {
      const i = next++;
      const { x, z } = slotPos(i);
      await loadShip(SHIPS[i], x, z);
      updateCount();
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  const msg = stats.failed
    ? `${SHIPS.length} slots · ${stats.failed} still missing (${stats.failedKeys.join(', ')})`
    : `${SHIPS.length} ships · 8 per row`;
  document.getElementById('count').textContent = stats.fallback
    ? `${msg} · ${stats.fallback} from registry`
    : msg;
}

loadAll();

const labelsDiv = document.getElementById('labels');
function updateLabels() {
  labelsDiv.innerHTML = '';
  for (const { worldPos, ship } of shipMeshes) {
    const v = worldPos.clone().add(new THREE.Vector3(0, -4, 0));
    v.project(camera);
    if (v.z > 1) continue;
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    if (x < -100 || x > window.innerWidth+100 || y < -50 || y > window.innerHeight+50) continue;
    const el = document.createElement('div');
    el.className = 'label';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = TIER_COL[ship.tier] || '#fff';
    el.innerHTML = `${ship.name}<span class="tier">T${ship.tier} · ${ship.hp}HP</span>`;
    labelsDiv.appendChild(el);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const t = performance.now() * 0.001;
  for (const { mesh } of shipMeshes) {
    mesh.traverse(o => {
      if (o.name !== 'hullJet' || !o.isMesh) return;
      o.material.opacity = 0.4 + 0.45 * Math.abs(Math.sin(t * 9 + mesh.id));
      const s = 0.85 + 0.28 * Math.abs(Math.sin(t * 11 + mesh.id));
      o.scale.setScalar(s);
    });
  }
  renderer.render(scene, camera);
  updateLabels();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.captureAll = () => {
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'gruda-armada-fleet.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
};

window.resetCamera = () => {
  frameCamera();
};
</script>
</body>
